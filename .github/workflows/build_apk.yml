# .github/workflows/build_apk.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Assemble & Build APK
        run: |
          # ۱. ساخت پروژه فلاتر
          flutter create --org com.transliterate app_project
          cd app_project

          # ۲. نصب پکیج‌های پایدار و هماهنگ
          flutter pub add flutter_contacts:^1.1.7+1 permission_handler:^11.3.1 flutter_riverpod:^2.5.1 path_provider:^2.1.2

          # ۳. انتقال کد اصلی برنامه
          cp ../lib/main.dart lib/main.dart

          # ۴. افزودن دسترسی مخاطبین به مانیفست اندروید
          python3 -c "
          import os
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r', encoding='utf-8') as f:
                  txt = f.read()
              perms = '    <uses-permission android:name=\"android.permission.READ_CONTACTS\" />\n    <uses-permission android:name=\"android.permission.WRITE_CONTACTS\" />\n'
              if 'READ_CONTACTS' not in txt:
                  txt = txt.replace('<application', perms + '    <application')
                  with open(manifest, 'w', encoding='utf-8') as f:
                      f.write(txt)
          "

          # ۵. بیلد نهایی فایل APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: contact-transliterate-release
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
