# .github/workflows/build_apk.yml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Assemble & Build APK
        run: |
          set -e
          # ۱. ساخت پروژه فلاتر
          flutter create --org com.transliterate app_project
          cd app_project

          # ۲. نصب وابستگی‌ها
          flutter pub add flutter_contacts permission_handler flutter_riverpod path_provider

          # ۳. کپی هوشمند فایل main.dart (چه در پوشه lib باشد چه در ریشه پروژه)
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
            echo "Found main.dart in ../lib/"
          elif [ -f "../main.dart" ]; then
            cp ../main.dart lib/main.dart
            echo "Found main.dart in root"
          else
            echo "Error: main.dart not found!"
            exit 1
          fi

          # ۴. افزودن دسترسی‌های مخاطبین به مانیفست اندروید
          python3 -c "
          import os
          manifest = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r', encoding='utf-8') as f:
                  txt = f.read()
              perms = '    <uses-permission android:name=\"android.permission.READ_CONTACTS\" />\n    <uses-permission android:name=\"android.permission.WRITE_CONTACTS\" />\n'
              if 'READ_CONTACTS' not in txt:
                  txt = txt.replace('<application', perms + '    <application')
                  with open(manifest, 'w', encoding='utf-8') as f:
                      f.write(txt)
          "

          # ۵. بیلد APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: contact-transliterate-release
          path: app_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
